name: Validate docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test documentation validator
        run: python -m unittest discover -s tests -v

      - name: Validate requirement IDs, SUMMARY.md reachability, files, and anchors
        run: python tools/validate_docs.py

      - name: Install pinned mdBook release
        run: |
          archive="${RUNNER_TEMP}/mdbook.tar.gz"
          install_dir="${RUNNER_TEMP}/mdbook-bin"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}"
          "${install_dir}/mdbook" --version
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Build documentation book
        run: mdbook build
